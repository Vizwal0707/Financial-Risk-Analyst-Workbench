[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-risk-platform"
version = "1.0.0"
description = "Enterprise Financial Fraud Detection & Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Principal Machine Learning Engineer & Technical Lead"}
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "pandera[io]>=0.18.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.1.0",
    "shap>=0.44.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "SQLAlchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "mlflow>=2.11.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short -p no:typeguard"
markers = [
    "unit: Isolated unit tests",
    "integration: Multi-component integration tests",
    "performance: Latency and throughput benchmarks",
    "asyncio: Asynchronous test runner",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true


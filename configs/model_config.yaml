random_seed: 42

autoencoder:
  model_name: "DeepSymmetricAutoencoder"
  architecture:
    input_dim: null  # Dynamically set based on feature vector length
    encoder_hidden_dims: [64, 32, 16]
    decoder_hidden_dims: [32, 64]
    dropout_rate: 0.10
    leaky_relu_slope: 0.10
  training:
    epochs: 25
    batch_size: 2048
    learning_rate: 0.001
    weight_decay: 1.0e-5
    patience: 5
    min_delta: 1.0e-4
    loss_function: "MSELoss"
    device: "auto"  # auto, mps, cuda, or cpu
    checkpoint_path: "models/autoencoder_best.pt"

xgboost:
  model_name: "CostWeightedXGBoostClassifier"
  parameters:
    objective: "binary:logistic"
    eval_metric: "aucpr"
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.80
    colsample_bytree: 0.80
    n_estimators: 500
    early_stopping_rounds: 30
    scale_pos_weight: null  # Calculated dynamically as n_neg / n_pos on train partition
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
  checkpoint_path: "models/xgboost_best.joblib"

calibration:
  methods:
    - "sigmoid"   # Platt Scaling
    - "isotonic"  # Non-parametric Isotonic Regression
  cv_folds: null  # Calibration fitted strictly on validation split (steps 501-620)

baselines:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: 10
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  heuristic_rule:
    amount_threshold: 200000.0
    transfer_only: true

